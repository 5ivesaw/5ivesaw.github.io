<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting — 5IVESAW</title>
  <link rel="canonical" href="https://5ivesaw.github.io/" />
  <script>
    (function() {
      var base = (location.origin && location.origin !== 'null' ? location.origin : 'https://5ivesaw.github.io') + '/';
      var target = base + (location.search || '') + (location.hash || '');
      location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=/" />
  <style>
    body {
      margin: 0;
      background: #0D0D11;
      color: #ECECF1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    a { color: #FF3B14; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <p>Redirecting to <a href="https://5ivesaw.github.io/">5ivesaw.github.io</a>...</p>
</body>
</html>
