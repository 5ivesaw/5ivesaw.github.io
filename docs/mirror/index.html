<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirror Redirect — 5IVESAW</title>
  <link rel="canonical" href="https://5ivesaw.github.io/" />
  <style>
    :root {
      --bg: #0D0D11;
      --card-bg: rgba(22, 22, 28, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #FF3B14;
      --ink: #ECECF1;
      --faint: #8E8EA0;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-mono);
      padding: 16px;
    }
    .redirect-card {
      max-width: 440px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 59, 20, 0.15);
      color: var(--accent);
      border: 1px solid rgba(255, 59, 20, 0.3);
      margin-bottom: 16px;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    p {
      color: var(--faint);
      font-size: 12.5px;
      line-height: 1.5;
      margin: 0 0 16px 0;
    }
    .countdown-box {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent);
      margin: 8px 0 14px 0;
      font-variant-numeric: tabular-nums;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.05s linear;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: #FFFFFF;
      text-decoration: none;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 6px;
      transition: background 0.15s ease, transform 0.15s ease;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .btn:hover {
      background: #E0300C;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>Mirror Detected</span>
    </div>
    <h1>Redirecting to Main Site</h1>
    <p>You accessed an alternate mirror address. Forwarding to the official transmission portal:</p>
    
    <div class="countdown-box" id="countdown">3</div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>

    <a id="redirectBtn" href="https://5ivesaw.github.io/" class="btn">
      <span>Redirect Now</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>

  <script>
    (function() {
      var base = (location.origin && location.origin !== 'null' ? location.origin : 'https://5ivesaw.github.io') + '/';
      var target = base + (location.search || '') + (location.hash || '');
      var btn = document.getElementById('redirectBtn');
      if (btn) btn.href = target;

      var totalSec = 3;
      var startTime = Date.now();
      var durationMs = totalSec * 1000;
      var cdEl = document.getElementById('countdown');
      var progEl = document.getElementById('progress');

      var timer = setInterval(function() {
        var elapsed = Date.now() - startTime;
        var remaining = Math.max(0, Math.ceil((durationMs - elapsed) / 1000));
        var progressPct = Math.min(100, (elapsed / durationMs) * 100);

        if (cdEl) cdEl.textContent = remaining;
        if (progEl) progEl.style.width = progressPct + '%';

        if (elapsed >= durationMs) {
          clearInterval(timer);
          location.replace(target);
        }
      }, 50);

      btn.addEventListener('click', function(e) {
        e.preventDefault();
        clearInterval(timer);
        location.replace(target);
      });
    })();
  </script>
</body>
</html>
